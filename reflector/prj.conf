# ── Base Bluetooth ──
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="CS Reflector"
# A single initiator served at a time
CONFIG_BT_MAX_CONN=1

# ── Security (answers the initiator's BT_SECURITY_L2) ──
CONFIG_BT_SMP=y
# No bonding: without CONFIG_BT_SETTINGS the keys do not survive a reboot, and
# stale RAM bonds break re-securing (err 2 PIN_OR_KEY_MISSING) and saturate the
# key pool (-ENOMEM). CS security only requires an encrypted link: per-session
# pairing, no storage.
CONFIG_BT_BONDABLE=n

# ── Channel Sounding ──
CONFIG_BT_CHANNEL_SOUNDING=y
# Aligned on the initiator: CS event reservation >= the negotiated
# max_subevent_len. MUST FOLLOW THE INITIATOR'S PROFILE FAMILY (cs_config.h):
#   DRONE_FAST_OUTDOOR (subevent 4500) -> 5000
#   DRONE_INDOOR / BOAT_DOCKING (subevent 8000, precision overlay) -> 8500
# Reflash the reflectors on every family change.
CONFIG_BT_CTLR_SDC_CS_EVENT_LEN_DEFAULT=8500
# Lets CS and ACL use different PHYs (validated sample)
CONFIG_BT_TRANSMIT_POWER_CONTROL=y
# The initiator rejects parameter-update requests (le_param_req -> false):
# we do not emit any (avoids noise, validated sample)
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n

# ── Ranging Service: server (Ranging ReSPonder) ──
CONFIG_BT_RAS=y
CONFIG_BT_RAS_RRSP=y
# Retention: keep 10 procedures (instead of 1) so the initiator in CONTINUOUS
# mode has time to fetch a counter before it is overwritten.
CONFIG_BT_RAS_RRSP_RD_BUFFERS_PER_CONN=10

# ── MTU/ACL aligned on the initiator ──
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# ── Misc ──
CONFIG_DK_LIBRARY=y
CONFIG_LOG=y

# ── RTT: enlarged buffer so the boot logs are not lost before the JLink
#    terminal attaches (1 KB by default, skip mode) ──
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
