# ── Bluetooth de base ──
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="CS Reflector"
# Un seul initiateur servi à la fois
CONFIG_BT_MAX_CONN=1

# ── Sécurité (répond au BT_SECURITY_L2 de l'initiateur) ──
CONFIG_BT_SMP=y
# Pas de bonding : sans CONFIG_BT_SETTINGS les clés ne survivent pas au
# reboot, et des bonds RAM périmés cassent la re-sécurisation (err 2
# PIN_OR_KEY_MISSING) et saturent le pool de clés (-ENOMEM). La sécurité
# CS n'exige qu'un lien chiffré : pairing par session, sans stockage.
CONFIG_BT_BONDABLE=n

# ── Channel Sounding ──
CONFIG_BT_CHANNEL_SOUNDING=y
# Aligné sur l'initiateur : réservation d'événement CS >= max_subevent_len
# négocié (4500 µs). 5000 = valeur par défaut du SDC, empreinte minimale.
CONFIG_BT_CTLR_SDC_CS_EVENT_LEN_DEFAULT=5000
# Permet à CS et ACL d'utiliser des PHY différents (sample validé)
CONFIG_BT_TRANSMIT_POWER_CONTROL=y
# L'initiateur rejette les demandes de mise à jour de paramètres
# (le_param_req → false) : on n'en émet pas (évite le bruit, sample validé)
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n

# ── Ranging Service : serveur (Ranging ReSPonder) ──
CONFIG_BT_RAS=y
CONFIG_BT_RAS_RRSP=y
# Rétention : garder 10 procédures (au lieu de 1) pour que l'initiateur en mode
# CONTINU ait le temps de récupérer un compteur avant qu'il soit écrasé.
CONFIG_BT_RAS_RRSP_RD_BUFFERS_PER_CONN=10

# ── MTU/ACL alignés sur l'initiateur ──
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# ── Divers ──
CONFIG_DK_LIBRARY=y
CONFIG_LOG=y

# ── RTT : buffer élargi pour ne pas perdre les logs de boot avant
#    l'attachement du terminal JLink (1 Ko par défaut, mode skip) ──
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096