# Profils CONF_DOCKING_PRECISION / CONF_INDOOR_PRECISION avec CS_NUM_REFLECTORS=2
# Subevent 8000 µs → réservation CS 8500 ; quadrillage :
#   SPACING >= ACL 3750 + CS 8500 + garde >= 3000  → 20000
#   intervalle = 2 × 20000 = 40 ms (CS_CONN_INTERVAL_UNITS=32 dans le profil)
CONFIG_BT_CTLR_SDC_CS_EVENT_LEN_DEFAULT=8500
CONFIG_BT_CTLR_SDC_CENTRAL_ACL_EVENT_SPACING_DEFAULT=20000
# Côté RÉFLECTEURS : reporter CS_EVENT_LEN_DEFAULT=8500.
